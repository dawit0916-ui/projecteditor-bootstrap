name: build-bootstrap
on:
  workflow_dispatch:

env:
  APP_ID: com.projecteditor.app

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: termux/termux-app
          ref: master
      - name: Build libproeditterminal.so
        run: |
          BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SRC=terminal-emulator/src/main/jni/termux.c
          sed -i 's/com_termux_terminal/com_projecteditor_terminal/g; s#com/termux/terminal#com/projecteditor/terminal#g' $SRC
          grep -n "projecteditor" $SRC | head
          mkdir -p out/arm64-v8a out/armeabi-v7a
          "$BIN/aarch64-linux-android21-clang" -shared -fPIC -Os -o out/arm64-v8a/libproeditterminal.so $SRC
          "$BIN/armv7a-linux-androideabi21-clang" -shared -fPIC -Os -o out/armeabi-v7a/libproeditterminal.so $SRC
      - uses: actions/upload-artifact@v4
        with:
          name: libtermux
          path: out

  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, arm]
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - name: Get termux-packages
        run: git clone --depth 1 https://github.com/termux/termux-packages.git tp
      - name: Set app id
        working-directory: tp
        run: |
          grep -n "com.termux" scripts/properties.sh || true
          sed -i "s/\"com\.termux\"/\"$APP_ID\"/" scripts/properties.sh
          grep -n "$APP_ID" scripts/properties.sh
      - name: Patch ncurses (remove foot)
        working-directory: tp
        run: |
          python3 - <<'PY'
          import re
          p='packages/ncurses/build.sh'
          s=open(p).read()
          s,n1=re.subn(r'\n[ \t]*"\$\(\. "\$TERMUX_SCRIPTDIR/x11-packages/foot/build\.sh"; echo "\$TERMUX_PKG_(?:VERSION|SRCURL|SHA256)"\)"\)',')',s)
          s,n2=re.subn(r'\n[ \t]*# Upstream instructions for building foot.*?tic -x -e foot,foot-direct -o "\$TI" -','',s,flags=re.S)
          assert n1==3 and n2==1
          open(p,'w').write(s)
          PY
          bash -n packages/ncurses/build.sh
      - name: Apply our package overrides
        run: |
          if [ -d overrides ]; then
            cp -r overrides/* tp/packages/
            ls overrides
          else
            echo "no overrides, using stock packages"
          fi
      - name: Check package names
        working-directory: tp
        run: |
          ok=1
          for p in apt bash coreutils dash dpkg findutils grep sed gawk tar gzip libbz2 \
                   liblzma libcurl less util-linux diffutils termux-tools termux-exec termux-keyring; do
            if [ -d "packages/$p" ]; then echo "ok $p"; else echo "MISSING $p"; ok=0; fi
          done
          echo "--- confirm sub-packages:"
          ls packages/liblzma/ packages/libcurl/ | grep -E "xz-utils|curl" || true
          [ "$ok" = 1 ]
      - name: Show bootstrap script options
        working-directory: tp
        run: |
          ls scripts
          ./scripts/generate-bootstraps.sh --help || true
      - name: Build base packages
        working-directory: tp
        run: |
          set -o pipefail
          ./scripts/run-docker.sh ./build-package.sh -a ${{ matrix.arch }} -o output \
            apt bash coreutils dash dpkg findutils grep sed gawk tar gzip libbz2 \
            liblzma libcurl less util-linux diffutils termux-tools termux-exec termux-keyring 2>&1 | tee build.log
      - name: Show error summary
        if: failure()
        working-directory: tp
        run: |
          [ -f build.log ] || { echo "no build.log yet"; exit 0; }
          grep -n -i -E "error|failed|no space|fatal" build.log | tail -40
          tail -60 build.log
          df -h /
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.arch }}
          path: tp/build.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
                - name: Pack the .deb files
        run: cd tp/output && tar -cf ../../debs-${{ matrix.arch }}.tar *.deb
      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.arch }}
          path: debs-${{ matrix.arch }}.tar
          retention-days: 14